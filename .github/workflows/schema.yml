name: Schema

on:
  pull_request:

concurrency:
  group: schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # schema:check compares migrations against `git merge-base HEAD origin/main`.
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        id: mise

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ steps.mise.outputs.node }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ steps.mise.outputs.node }}-

      - run: npm ci

      - name: Schema check (seed == migrations)
        run: npm run -s schema:check

      - name: Schema unit tests
        run: npm run -s schema:test

      - name: Schema rehearsal (throwaway server, base seed -> all migrations)
        run: npm run -s schema:rehearse

      - name: Typecheck
        run: npm run -s typecheck
